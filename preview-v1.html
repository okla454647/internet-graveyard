<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Internet Graveyard — Preview v1</title>
<style>
:root{--bg:#0b100c;--panel:#121813;--panel2:#151d17;--line:#2a342c;--text:#f3f0e7;--muted:#aeb6ad;--accent:#eeebe1;--green:#c9f0d1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#151d17 0,#0b100c 44%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:0 22px 80px}header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em}.lang button{margin-left:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px;border-radius:10px}.lang button.active{background:var(--accent);color:#111}.hero{text-align:center;padding:92px 0 64px}.switch{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}.switch button{border:1px solid var(--line);background:#111713;color:var(--muted);padding:11px 16px;border-radius:999px;font-weight:800}.switch button.active{background:var(--accent);color:#111}.kicker{color:#8f9b91;font-size:14px;margin-bottom:16px}.hero h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,78px);line-height:1.08;margin:0 auto 18px;max-width:900px}.hero p{color:var(--muted);font-size:17px;line-height:1.8;margin:0 auto;max-width:700px}.cta{margin-top:28px;border:0;border-radius:14px;padding:16px 26px;background:var(--accent);color:#111;font-weight:900;font-size:16px}.note{color:#7e897f;font-size:13px;margin-top:10px}.browse{display:inline-block;margin-top:20px;color:#d7ddd7;text-decoration:none;font-size:14px;border-bottom:1px solid #566057;padding-bottom:2px}.section{padding:32px 0}.section h2{font-size:28px;margin:0 0 6px}.section .sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:18px;padding:22px;min-height:230px}.stone{font-size:44px}.card h3{margin:8px 0 6px}.card p{color:#d8ded7;line-height:1.55}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:12px;margin-top:8px}.preview-banner{position:sticky;top:0;z-index:20;background:#1b160f;border-bottom:1px solid #6b5739;color:#e6d8bc;text-align:center;padding:8px 14px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(620px,100%);background:#101511;border:1px solid var(--line);border-radius:20px;padding:26px;max-height:90vh;overflow:auto}.box h3{font-size:26px;margin:0 0 6px}.box .small{color:var(--muted);font-size:13px;line-height:1.6}.close{float:right;border:0;background:transparent;color:var(--text);font-size:28px}.field{margin-top:16px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0a0e0b;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px}.field textarea{min-height:90px;resize:vertical}.submit{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#111;font-weight:900}.success{display:none;text-align:center;padding:10px 0}.success.show{display:block}.grave-no{font-family:Georgia,serif;font-size:34px;margin:14px 0 6px}.success p{color:var(--muted);line-height:1.7}.actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:18px}.actions button{border-radius:12px;padding:13px;border:1px solid var(--line);background:#141b16;color:var(--text);font-weight:800}.actions button.primary{background:var(--accent);color:#111;border-color:var(--accent)}.memorial body{}.memorial-mode{background:radial-gradient(circle at top,#1a1a17 0,#0d100d 46%)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:70px 0 48px}.hero h1{font-size:46px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="preview-banner">PREVIEW V1 · 測試頁，不會建立真實墓碑，也不會影響正式網站資料</div>
<div class="wrap">
<header><div class="brand">INTERNET GRAVEYARD</div><div class="lang"><button id="zhBtn" class="active" onclick="setLang('zh')">中</button><button id="enBtn" onclick="setLang('en')">EN</button></div></header>
<section class="hero" id="top">
  <div class="switch"><button id="projectBtn" class="active" onclick="setMode('project')">🪦 Project Graveyard</button><button id="memorialBtn" onclick="setMode('memorial')">🕯️ Memorial Garden</button></div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <button class="cta" id="mainCta" onclick="openCreate()"></button>
  <div class="note" id="proof"></div>
  <a class="browse" href="#examples" id="browse"></a>
</section>
<section class="section" id="examples"><h2 id="examplesTitle"></h2><div class="sub" id="examplesSub"></div><div class="grid" id="cards"></div></section>
</div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeCreate()">×</button><div id="formWrap"><h3 id="formTitle"></h3><div class="small" id="formSub"></div><div class="field"><label id="nameLabel"></label><input id="nameInput" placeholder=""></div><div class="field" id="causeField"><label id="causeLabel"></label><select id="causeInput"><option>失去動力</option><option>時間不夠</option><option>沒人使用</option><option>技術卡關</option><option>其他</option></select></div><div class="field"><label id="epitaphLabel"></label><textarea id="epitaphInput"></textarea></div><button class="submit" id="submitBtn" onclick="completeDemo()"></button></div><div class="success" id="success"><div style="font-size:44px" id="successIcon">🪦</div><h3 id="successTitle"></h3><div class="grave-no" id="graveNo"></div><p id="successCopy"></p><div class="actions"><button class="primary" id="shareBtn" onclick="demoShare()"></button><button id="viewBtn" onclick="closeCreate()"></button></div></div></div></div>
<script>
let lang='zh',mode='project';
const copy={
zh:{project:{kicker:'給那些曾經認真做過，最後卻停下來的東西。',title:'做失敗了？<br>別刪掉。埋了它。🪦',subtitle:'替你死掉的 App、遊戲、網站、Startup、YouTube 頻道，留下一座永久墓碑。',cta:'🪦 免費建立墓碑',proof:'不用註冊 · 約 30 秒',browse:'看看別人埋了什麼 ↓',examplesTitle:'看看別人埋了什麼',examplesSub:'每一座墓碑，都是一個曾經有人認真做過的東西。',formTitle:'替它立一座墓碑',formSub:'只填最重要的三件事。這個預覽不會送出真實資料。',name:'它叫什麼？',cause:'它怎麼死的？',epitaph:'最後想留一句什麼話？',submit:'正式下葬（預覽）',success:'✓ 已正式下葬',no:'GRAVE #27',successCopy:'你的失敗現在有了一個正式墓碑編號。分享出去，讓這次失敗至少留下一點傳說。',share:'🔗 分享我的失敗',view:'查看墓碑'},memorial:{kicker:'給那些值得被記得的人、事、地方與時光。',title:'有些事情結束了，<br>但不必消失。',subtitle:'為一個人、一隻寵物、一個地方，或人生的一段記憶，留下一個可以再次回來看的地方。',cta:'🌿 免費留下紀念',proof:'不用註冊 · 約 30 秒',browse:'看看花園裡留下了什麼 ↓',examplesTitle:'看看花園裡留下了什麼',examplesSub:'這裡沒有排名，只留下值得被記得的事物。',formTitle:'留下一段紀念',formSub:'只填最重要的內容。這個預覽不會送出真實資料。',name:'想紀念誰／什麼？',epitaph:'想留下什麼話？',submit:'留下紀念（預覽）',success:'✓ 紀念已建立',no:'MEMORIAL #12',successCopy:'這段紀念現在有了自己的編號。把它分享給也記得的人，讓這份回憶被留下來。',share:'🔗 分享這段紀念',view:'查看紀念碑'}},
en:{project:{kicker:'For the things you seriously tried to build, but eventually left behind.',title:'Failed?<br>Don’t delete it. Bury it. 🪦',subtitle:'Give your dead app, game, website, startup, or YouTube channel a permanent grave.',cta:'🪦 CREATE A GRAVE — FREE',proof:'No sign-up · About 30 seconds',browse:'See what others buried ↓',examplesTitle:'See what others buried',examplesSub:'Every grave is something someone once seriously tried to build.',formTitle:'Give it a grave',formSub:'Just three important things. This preview does not submit real data.',name:'What was it called?',cause:'What killed it?',epitaph:'What is its final line?',submit:'BURY IT (PREVIEW)',success:'✓ OFFICIALLY BURIED',no:'GRAVE #27',successCopy:'Your failure now has an official grave number. Share it so the failure leaves behind at least one legend.',share:'🔗 SHARE MY FAILURE',view:'VIEW GRAVE'},memorial:{kicker:'For the people, places, pets, and moments worth remembering.',title:'Some things end.<br>They don’t have to disappear.',subtitle:'Leave a place to return to for a person, a pet, a place, or a chapter of your life.',cta:'🌿 CREATE A MEMORIAL — FREE',proof:'No sign-up · About 30 seconds',browse:'See what people remembered ↓',examplesTitle:'See what people remembered',examplesSub:'No rankings here — just things worth remembering.',formTitle:'Create a memorial',formSub:'Only the essentials. This preview does not submit real data.',name:'Who or what are you remembering?',epitaph:'What would you like to leave behind?',submit:'CREATE MEMORIAL (PREVIEW)',success:'✓ MEMORIAL CREATED',no:'MEMORIAL #12',successCopy:'This memory now has its own number. Share it with someone who remembers too.',share:'🔗 SHARE THIS MEMORIAL',view:'VIEW MEMORIAL'}}};
function setLang(v){lang=v;zhBtn.classList.toggle('active',v==='zh');enBtn.classList.toggle('active',v==='en');document.documentElement.lang=v==='zh'?'zh-Hant':'en';render()}
function setMode(v){mode=v;projectBtn.classList.toggle('active',v==='project');memorialBtn.classList.toggle('active',v==='memorial');document.body.classList.toggle('memorial-mode',v==='memorial');render()}
function render(){const c=copy[lang][mode];kicker.innerHTML=c.kicker;title.innerHTML=c.title;subtitle.innerHTML=c.subtitle;mainCta.innerHTML=c.cta;proof.innerHTML=c.proof;browse.innerHTML=c.browse;examplesTitle.innerHTML=c.examplesTitle;examplesSub.innerHTML=c.examplesSub;formTitle.innerHTML=c.formTitle;formSub.innerHTML=c.formSub;nameLabel.innerHTML=c.name;epitaphLabel.innerHTML=c.epitaph;submitBtn.innerHTML=c.submit;causeField.style.display=mode==='project'?'block':'none';if(mode==='project')causeLabel.innerHTML=c.cause;successTitle.innerHTML=c.success;graveNo.innerHTML=c.no;successCopy.innerHTML=c.successCopy;shareBtn.innerHTML=c.share;viewBtn.innerHTML=c.view;successIcon.innerHTML=mode==='project'?'🪦':'🕯️';cards.innerHTML=mode==='project'?projectCards():memorialCards()}
function projectCards(){return '<div class="card"><div class="stone">🪦</div><h3>Side Project #14</h3><p>「我真的以為這次會做完。」</p><span class="tag">死因：失去動力</span></div><div class="card"><div class="stone">🪦</div><h3>My First Game</h3><p>「做到第 83 個 BUG，我投降了。」</p><span class="tag">死因：技術卡關</span></div><div class="card"><div class="stone">🪦</div><h3>Zero User Startup</h3><p>「產品完成了，使用者沒有來。」</p><span class="tag">死因：沒人使用</span></div>'}
function memorialCards(){return '<div class="card"><div class="stone">🕯️</div><h3>Lucky</h3><p>「謝謝你陪我走過 14 年。」</p><span class="tag">寵物</span></div><div class="card"><div class="stone">🌿</div><h3>老家的陽台</h3><p>「夏天的風，我還記得。」</p><span class="tag">地方</span></div><div class="card"><div class="stone">🕯️</div><h3>2024 的我們</h3><p>「有些人生章節結束了，但不需要刪除。」</p><span class="tag">人生片段</span></div>'}
function openCreate(){formWrap.style.display='block';success.classList.remove('show');modal.classList.add('open')}
function closeCreate(){modal.classList.remove('open')}
function completeDemo(){formWrap.style.display='none';success.classList.add('show')}
function demoShare(){const msg=mode==='project'?(lang==='zh'?'分享功能下一版會接真實墓碑連結與分享卡。':'The next version will connect real grave links and share cards.'):(lang==='zh'?'分享功能下一版會接真實紀念連結與分享卡。':'The next version will connect real memorial links and share cards.');alert(msg)}
modal.addEventListener('click',e=>{if(e.target===modal)closeCreate()});render();
</script>
</body>
</html>
