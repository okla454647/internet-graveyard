name: Improve post-create sharing
on:
  push:
    paths:
      - '.github/workflows/post-create-share-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internet-graveyard
      - name: Improve post-create sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_css='''.completion-actions{\n  display:none;grid-template-columns:1fr 1fr;gap:9px;max-width:430px;margin:0 auto\n}\n'''
          new_css='''.completion-actions{\n  display:none;grid-template-columns:1.2fr 1fr 1fr;gap:9px;max-width:520px;margin:0 auto\n}\n.completion-copy-link{border:1px solid var(--line);background:#151c17;color:var(--text);border-radius:11px;padding:12px 10px;font-weight:800}\n@media(max-width:520px){.completion-actions{grid-template-columns:1fr}.completion-actions button{width:100%}}\n'''
          if old_css not in s: raise SystemExit('completion css anchor not found')
          s=s.replace(old_css,new_css,1)

          old_html='''      <div class="completion-actions" id="completionActions">\n        <button class="completion-share" id="completionShareBtn" type="button" onclick="shareNewGrave()">🔗 分享</button>\n        <button class="completion-view" id="completionViewBtn" type="button" onclick="finishCompletion()">查看墓碑</button>\n      </div>\n'''
          new_html='''      <div class="completion-actions" id="completionActions">\n        <button class="completion-share" id="completionShareBtn" type="button" onclick="shareNewGrave()">🔗 分享</button>\n        <button class="completion-copy-link" id="completionCopyLinkBtn" type="button" onclick="copyNewGraveUrl()">複製專屬連結</button>\n        <button class="completion-view" id="completionViewBtn" type="button" onclick="finishCompletion()">查看墓碑</button>\n      </div>\n'''
          if old_html not in s: raise SystemExit('completion html anchor not found')
          s=s.replace(old_html,new_html,1)

          old_copy='''   completionCopy.textContent=isMemorial\n     ?(lang==="zh"\n       ?"這段紀念現在有了自己的編號。把它分享給也記得的人，讓這份回憶被留下來。"\n       :"This memory now has its own number. Share it with someone who remembers.")\n     :(lang==="zh"\n       ?"你的失敗現在有了一個正式墓碑編號。分享出去，讓這次失敗至少留下一點傳說。"\n       :"Your failure now has an official grave number. Share it and leave a little legend behind.");\n'''
          new_copy='''   const createdNumber=g.typeNumber||g.id;\n   completionCopy.textContent=isMemorial\n     ?(lang==="zh"\n       ?"紀念 #"+createdNumber+" 已經留下來了。這是它的專屬頁面；分享給也記得的人，之後都能從同一個連結回來。"\n       :"Memorial #"+createdNumber+" is now here to stay. Share its permanent page with someone who remembers.")\n     :(lang==="zh"\n       ?"墓碑 #"+createdNumber+" 已正式下葬。這是它的專屬頁面；分享出去，讓這次失敗至少留下一點傳說。"\n       :"Grave #"+createdNumber+" is officially buried. Share its permanent page and leave a little legend behind.");\n'''
          if old_copy not in s: raise SystemExit('completion copy anchor not found')
          s=s.replace(old_copy,new_copy,1)

          old_btn='''   completionViewBtn.textContent=isMemorial\n     ?(lang==="zh"?"查看紀念碑":"View memorial")\n     :(lang==="zh"?"查看墓碑":"View grave");\n'''
          new_btn='''   if(typeof completionCopyLinkBtn!=="undefined") completionCopyLinkBtn.textContent=isMemorial\n     ?(lang==="zh"?"複製紀念連結":"Copy memorial link")\n     :(lang==="zh"?"複製墓碑連結":"Copy grave link");\n   completionViewBtn.textContent=isMemorial\n     ?(lang==="zh"?"查看紀念碑":"View memorial")\n     :(lang==="zh"?"查看墓碑":"View grave");\n'''
          if old_btn not in s: raise SystemExit('completion button anchor not found')
          s=s.replace(old_btn,new_btn,1)

          old_fallback=''' try{\n   await navigator.clipboard.writeText(shareText+" "+url);\n   showToast(lang==="zh"?"分享內容已複製":"Share text copied");\n }catch(e){\n   toggleShare();\n }\n}\n'''
          new_fallback=''' try{\n   await navigator.clipboard.writeText(url);\n   showToast(lang==="zh"?"專屬連結已複製":"Link copied");\n }catch(e){\n   toggleShare();\n }\n}\n\nasync function copyNewGraveUrl(){\n const g=graves.find(x=>x.id===activeId);if(!g)return;\n try{\n   await navigator.clipboard.writeText(graveShareUrl(g));\n   showToast(g.graveType==="memorial"\n     ?(lang==="zh"?"紀念連結已複製":"Memorial link copied")\n     :(lang==="zh"?"墓碑連結已複製":"Grave link copied"));\n }catch(e){\n   toggleShare();\n }\n}\n'''
          if old_fallback not in s: raise SystemExit('share fallback anchor not found')
          s=s.replace(old_fallback,new_fallback,1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve post-create sharing flow"
          git push origin internet-graveyard
